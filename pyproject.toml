[project]
name = "erm-bench"
version = "0.1.0"
description = "ERM peer benchmarking: Product A (risk profile benchmarking), phase 1"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",
]

[project.scripts]
erm-bench = "erm_bench.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erm_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
